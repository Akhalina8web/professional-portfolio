<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Alina Khalina</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
    <nav>
        <div class="logo">ALINA KHALINA</div>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Skills &amp; Projects</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    <div class="theme-switcher" aria-label="Choose color theme">
    <span>Theme</span>

    <button type="button"
            class="theme-btn sage"
            data-theme="sage"
            aria-label="Sage theme"
            title="Sage theme"></button>

    <button type="button"
            class="theme-btn warm"
            data-theme="warm"
            aria-label="Warm theme"
            title="Warm theme"></button>

    <button type="button"
            class="theme-btn dark"
            data-theme="dark"
            aria-label="Dark theme"
            title="Dark theme"></button>
</div>
</header>


    <main>

        <section class="contact-section">

            <div class="contact-intro">
                <p class="section-label">GET IN TOUCH</p>

                <h1>Let's Connect</h1>

                <p>Have a question, project idea, or just want to connect?</p>
                   <p>I'd be happy to hear from you.</p> 
                
            </div>


            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required></textarea>
                </div>

                <button type="submit">Send Message</button>

            </form>

        </section>

    </main>


    <footer class="site-footer">

        <div class="footer-connect">

            <span>Let's connect!</span>

           <div class="social-links">
           <a target="_blank" href="https://www.linkedin.com/in/alina-khalina-44995634a" aria-label="LinkedIn">in</a>
            <a target="_blank" href="mailto:contact@alinakhalina.com" aria-label="Email">✉</a>
            <a target="_blank" href="https://github.com/Akhalina8web" aria-label="GitHub">GH</a>
        </div>

        </div>

        <div class="footer-right">
            <p>© 2026 Alina Khalina · All rights reserved.</p>
        </div>

    </footer>
<script src="theme.js"></script>
</body>

</html>
